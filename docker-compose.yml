services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshwater-backend
    environment:
      NODE_ENV: production
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshwater-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
